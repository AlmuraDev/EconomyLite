plugins {
    id 'java'
}

base {
    archivesName = 'EconomyLite'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = uri('https://repo.spongepowered.org/repository/maven-public/')
        content {
            includeGroup('org.spongepowered')
        }
    }
}

configurations {
    // Jars packed into the plugin jar as plain files (META-INF/economylite/libs), not on the class path
    bundledH2 { transitive = false }
    bundledH2Legacy { transitive = false }
}

dependencies {
    // SpongeNeo brings SpongeAPI (with Adventure, Configurate, Guice, Caffeine and Log4j) at run time
    compileOnly("org.spongepowered:spongeapi:${sponge_api_version}")

    bundledH2("com.h2database:h2:${h2_version}")
    bundledH2Legacy("com.h2database:h2:${h2_legacy_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

def pluginProps = [
        'version'           : project.version,
        'sponge_api_version': sponge_api_version.replace('-SNAPSHOT', ''),
        'h2_version'        : h2_version,
        'h2_legacy_version' : h2_legacy_version
]

processResources {
    inputs.properties(pluginProps)
    filesMatching(['META-INF/sponge_plugins.json', 'economylite-build.properties']) {
        expand(pluginProps)
    }
    into('META-INF/economylite/libs') {
        from(configurations.bundledH2) { rename { "h2-${h2_version}.jar" } }
        from(configurations.bundledH2Legacy) { rename { "h2-${h2_legacy_version}.jar" } }
    }
}

jar {
    manifest {
        attributes(
                'Specification-Title': 'EconomyLite',
                'Implementation-Title': 'EconomyLite',
                'Implementation-Version': project.version
        )
    }
}
